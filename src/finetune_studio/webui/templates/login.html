<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">
  <title>Sign in · Finetune Studio</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/app.css?v=88">
  <link rel="stylesheet" href="/static/css/login.css?v=1">
</head>
<body class="login-body">
  <main class="login-card">
    <h1 class="login-title">Finetune Studio</h1>
    <p class="login-sub">This instance is password protected.</p>
    <form id="login-form" class="login-form" autocomplete="on">
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required autofocus>
      <input type="hidden" id="login-next" value="{{ next }}">
      <button type="submit" class="btn btn-primary" id="login-submit">Sign in</button>
      <p id="login-error" class="login-error" role="alert" hidden></p>
    </form>
    <p class="login-help">Forgot it? On the machine that runs Finetune Studio: <code>fts auth set-password</code></p>
  </main>
  <script>
    (function () {
      var form = document.getElementById('login-form');
      var err = document.getElementById('login-error');
      var btn = document.getElementById('login-submit');
      form.addEventListener('submit', async function (ev) {
        ev.preventDefault();
        err.hidden = true;
        btn.disabled = true;
        btn.textContent = 'Signing in…';
        try {
          var r = await fetch('/api/auth/login', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'same-origin',
            body: JSON.stringify({password: document.getElementById('login-password').value,
                                  next: document.getElementById('login-next').value})
          });
          var data = await r.json().catch(function () { return {}; });
          if (!r.ok) throw new Error(data.detail || ('sign-in failed (HTTP ' + r.status + ')'));
          window.location.assign(data.next || '/');
        } catch (e) {
          err.textContent = e.message;
          err.hidden = false;
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      });
    })();
  </script>
</body>
</html>
