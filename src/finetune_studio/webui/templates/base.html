<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Finetune Studio{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="h-full bg-gray-950 text-gray-100">
    <div class="flex h-full">
        <nav class="w-56 bg-gray-900 border-r border-gray-800 p-4 flex flex-col gap-1 shrink-0">
            <a href="/" class="text-lg font-bold text-emerald-400 mb-4 px-3 hover:text-emerald-300">Finetune Studio</a>
            <a href="/" class="px-3 py-2 rounded hover:bg-gray-800 {% block nav_dashboard %}{% endblock %}">Dashboard</a>
            <a href="/projects" class="px-3 py-2 rounded hover:bg-gray-800 {% block nav_projects %}{% endblock %}">Projects</a>
            <a href="/projects" class="px-3 py-2 rounded hover:bg-gray-800 {% block nav_chat %}{% endblock %}">Chat</a>

            {# Project-scoped nav: only visible inside a project #}
            {% if pid is defined and pid %}
            <div class="mt-2 mb-1 px-3 text-xs text-gray-500 uppercase tracking-wider">{{ project.name if project else 'Project' }}</div>
            <a href="/projects/{{ pid }}" class="px-3 py-2 rounded hover:bg-gray-800 {% block nav_project_overview %}{% endblock %}">Overview</a>
            <a href="/projects/{{ pid }}/data" class="px-3 py-2 rounded hover:bg-gray-800 {% block nav_data %}{% endblock %}">Data</a>
            <a href="/projects/{{ pid }}/training" class="px-3 py-2 rounded hover:bg-gray-800 {% block nav_training %}{% endblock %}">Training</a>
            <a href="/projects/{{ pid }}/testing" class="px-3 py-2 rounded hover:bg-gray-800 {% block nav_testing %}{% endblock %}">Testing</a>
            <a href="/projects/{{ pid }}/models" class="px-3 py-2 rounded hover:bg-gray-800 {% block nav_models %}{% endblock %}">Models</a>
            <a href="/projects/{{ pid }}/benchmarks" class="px-3 py-2 rounded hover:bg-gray-800 {% block nav_benchmarks %}{% endblock %}">Benchmarks</a>
            <a href="/projects/{{ pid }}/agentic" class="px-3 py-2 rounded hover:bg-gray-800 {% block nav_agentic %}{% endblock %}">Agentic</a>
            <a href="/projects/{{ pid }}/chat" class="px-3 py-2 rounded hover:bg-gray-800 {% block nav_project_chat %}{% endblock %}">Chat</a>
            {% endif %}

            <div class="mt-auto px-3 text-xs text-gray-600">v0.1.0</div>
        </nav>
        <main class="flex-1 overflow-auto p-6">{% block content %}{% endblock %}</main>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
