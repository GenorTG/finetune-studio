{% extends "base.html" %}
{% block title %}Data · Finetune Studio{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Data</h1>
  <div class="sub">Upload and browse source files for any project.</div>
</div>

<div class="card">
  <div class="card-head">
    <div>
      <div class="card-title">Upload</div>
      <div class="card-sub">Pick a project, then files. They get content-hashed so the same file is never stored twice.</div>
    </div>
  </div>
  <form id="upload-form" data-api="/api/data/upload" data-reload="true" enctype="multipart/form-data">
    <div class="grid grid-2 gap-3 items-end">
      <label>
        <span class="block text-xs muted mb-1">Project</span>
        <select name="project_id" class="select" required>
          <option value="">— pick a project —</option>
          {% for p in projects %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
        </select>
      </label>
      <label>
        <span class="block text-xs muted mb-1">Files</span>
        <input type="file" name="files" multiple class="input" style="padding:8px;">
      </label>
    </div>
    <button type="submit" class="btn primary mt-3">Upload</button>
  </form>
</div>
{% endblock %}
