[project]
name = "finetune-studio"
version = "0.1.0"
description = "Full-featured model training app with WebUI"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "trl>=0.12.0",
    "peft>=0.14.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.27.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "aiosqlite>=0.20.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "requests>=2.31.0",
    "aiofiles>=23.2.0",
    # inference-server (chat template renderer) is added as a local editable
    # dep via [tool.uv.sources] — see below. For pip-only installs, run:
    #   pip install -e ../inference-server
]

[tool.uv.sources]
inference-server = { path = "../inference-server", editable = true }

[project.optional-dependencies]
# GGUF is installed separately by install.sh (GPU-aware wheel selection).
# Only use this if you want a manual CPU-only install: pip install -e .[gguf]
gguf = ["llama-cpp-python>=0.3.0"]
bitsandbytes = ["bitsandbytes>=0.43.0"]

[project.scripts]
finetune-studio = "finetune_studio.cli:main"
fts = "finetune_studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finetune_studio"]
